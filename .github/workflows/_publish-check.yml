# Geçici tanı: yayınlanan paketi kimlikli olarak sorgular.
# Belirtecin kendisi YAZILMAZ. Tanı biter bitmez bu dosya silinir.
name: Yayın tanısı

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Kimlikli sorgu
        env:
          T: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$T" > ~/.npmrc
          echo "--- belirteç sahibi ---"
          npm whoami || echo "whoami başarısız"
          echo "--- paket görünür mü ---"
          npm view @yankikucuk/ubl-tr version || echo "view başarısız"
          echo "--- erişim düzeyi ---"
          npm access get status @yankikucuk/ubl-tr || echo "access başarısız"
          echo "--- kullanıcının paketleri ---"
          npm access list packages || echo "list başarısız"
